<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="ship-container">
        <img src="./img/spacecraft.png" class="spacecraft"></img>
        <div class="flames">
            <div class="flame"></div>
            <div class="flame"></div>
        </div>
    </div>
    <div class="controls">
        <button class="start unselectable">Start</button>
        <button class="left unselectable">Left</button>
        <button class="right unselectable">Right</button>
        <button class="reload unselectable">Reload</button>
    </div>
</body>

</html>
